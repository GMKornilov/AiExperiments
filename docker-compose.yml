services:
  brewmark-mcp:
    build:
      context: ./backend
      dockerfile: Dockerfile.mcp
    ports:
      - "${MCP_PORT:-8081}:8080"
    environment:
      BREWMARK_BASE_URL: ${BREWMARK_BASE_URL:-https://brewmark.io}
      BREWMARK_API_TOKEN: ${BREWMARK_API_TOKEN:-}
      BREWMARK_REQUEST_TIMEOUT: ${BREWMARK_REQUEST_TIMEOUT:-10s}
      MCP_ADDR: :8080
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # A small operator-facing executable for checking the deployed MCP registry.
  # It is opt-in so a normal application stack runs only the server.
  brewmark-mcp-client:
    profiles: ["diagnostics"]
    build:
      context: ./backend
      dockerfile: Dockerfile.mcp-client
    environment:
      BREWMARK_MCP_URL: http://brewmark-mcp:8080/mcp
    depends_on:
      brewmark-mcp:
        condition: service_healthy

  barista-api:
    build: ./backend
    # Файл передаётся только запущенному контейнеру и не входит в image.
    # BARISTA_ENV_FILE позволяет выбрать другой dotenv-файл, например deploy/production.env.
    env_file:
      - ${BARISTA_ENV_FILE:-.env}
    volumes:
      - barista-history:/app/data
      - ./backend/config.yaml:/app/config.yaml:ro
      - ./backend/llm.yaml:/app/llm.yaml:ro
      - ./backend/prompts/barista-system.txt:/app/prompts/barista-system.txt:ro
      - ./backend/prompts/chat-title-system.txt:/app/prompts/chat-title-system.txt:ro
      - ./backend/prompts/history-summary-system.txt:/app/prompts/history-summary-system.txt:ro
      - ./backend/prompts/facts-system.txt:/app/prompts/facts-system.txt:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  barista-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        SITE_URL: ${SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    environment:
      BARISTA_BACKEND_URL: http://barista-api:8080
      BREWMARK_MCP_URL: http://brewmark-mcp:8080/mcp
    depends_on:
      barista-api:
        condition: service_healthy
      brewmark-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  barista-history:
