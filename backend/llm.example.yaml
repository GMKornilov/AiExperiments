chat:
  # Set to the actual context limit of your provider/model; 0 means unknown.
  context_window_tokens: 0
  base_url: "https://api.deepseek.com/v1"
  api_key: "replace-me"
  model: "deepseek-chat"
  request_timeout: 30s
  temperature: 1
  system_prompt_path: "prompts/barista-system.txt"
text:
  base_url: "https://api.deepseek.com/v1"
  api_key: "replace-me"
  model: "deepseek-v4-flash"
  request_timeout: 30s
  temperature: 0.2
  system_prompt_path: "prompts/chat-title-system.txt"
summary:
  base_url: "https://api.deepseek.com/v1"
  api_key: "replace-me"
  model: "deepseek-v4-flash"
  request_timeout: 30s
  temperature: 0.2
  system_prompt_path: "prompts/history-summary-system.txt"
  keep_last_messages: 10
  batch_size: 10
